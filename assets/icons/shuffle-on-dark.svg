<!-- shuffle-off-light.svg -->
<svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Shuffle off light" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowOffLight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
    </marker>
  </defs>

  <!-- top curved line -->
  <path d="M3 6 C8 6, 13 14, 21 6"
        fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        marker-end="url(#arrowOffLight)"/>
  <!-- bottom curved line -->
  <path d="M3 18 C8 18, 13 10, 21 18"
        fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        marker-end="url(#arrowOffLight)"/>
  <!-- slash to indicate 'off' -->
  <line x1="4" y1="20" x2="20" y2="4" stroke="#000" stroke-width="2" stroke-linecap="round" />
</svg>